# docs/dashboard/care-plan.de.yaml
#
# Combine current lawn actions and upcoming mowing/watering information.
# Copy into a Lovelace manual card and replace the example entity IDs and
# REPLACE_WITH_ENTRY_ID where present. Mushroom cards require that custom frontend
# component. Templates render HA state translations while raw codes stay stable.
# This dashboard reads HA state; service buttons delegate validation to HA.
#
type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.rasen_pflegeplan
  primary: Pflegeplan
  secondary: '{{ state_translated(entity) }}'
  icon: mdi:calendar-check
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_pflegeplan
  primary: Mähen
  secondary: '{% set p = state_attr(entity, ''mowing'') or {} %}{{ p.get(''reason_text'') or ''—'' }}

    {{ p.get(''next_at'') or ''—'' }}'
  multiline_secondary: true
  icon: mdi:robot-mower
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_pflegeplan
  primary: Bewässerung
  secondary: '{% set p = state_attr(entity, ''watering'') or {} %}{% set start = p.get(''next_start'') or {} %}{{
    start.get(''at'') or ''—'' }}

    {{ p.get(''recommended_liters'') or 0 }} L

    {{ p.get(''blocker_text'') or '''' }}'
  multiline_secondary: true
  icon: mdi:water
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_pflegeplan
  primary: Düngen
  secondary: '{% set p = state_attr(entity, ''fertilizing'') or {} %}{{ p.get(''window'') or ''—'' }}

    {{ (p.get(''reasons_text'') or []) | join('' · '') }}'
  multiline_secondary: true
  icon: mdi:flower
  tap_action:
    action: more-info
