# docs/dashboard/care-plan.de.yaml
#
# Combine current lawn actions and upcoming mowing/watering information.
# Copy into a Lovelace manual card and replace the example entity IDs and
# REPLACE_WITH_ENTRY_ID where present. Mushroom cards require that custom frontend
# component. Templates render HA state translations while raw codes stay stable.
# This dashboard reads HA state; service buttons delegate validation to HA.
#
type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.rasen_pflegeplan
  primary: Pflegeplan
  secondary: '{% set s = state_attr(entity, ''summary'') or {} %}{{ s.get(''action_text'') or state_translated(entity)
    }} · {{ s.get(''availability_text'') or '''' }}

    {{ s.get(''blocker_text'') or s.get(''reason_text'') or '''' }}

    {% if s.get(''not_before'') %}{{ as_local(as_datetime(s.get(''not_before''))).strftime(''%d.%m. %H:%M'')
    }}{% endif %}'
  icon: mdi:calendar-check
  tap_action:
    action: more-info
  multiline_secondary: true
- type: custom:mushroom-template-card
  entity: sensor.rasen_pflegeplan
  primary: Mähen
  secondary: '{% set p = state_attr(entity, ''mowing'') or {} %}{{ p.get(''reason_text'') or ''—'' }}

    {{ p.get(''next_at'') or ''—'' }}'
  multiline_secondary: true
  icon: mdi:robot-mower
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_pflegeplan
  primary: Bewässerung
  secondary: '{% set p = state_attr(entity, ''watering'') or {} %}{% set start = p.get(''next_start'')
    or {} %}{{ start.get(''at'') or ''—'' }}

    {{ p.get(''recommended_liters'') or 0 }} L

    {{ p.get(''blocker_text'') or '''' }}'
  multiline_secondary: true
  icon: mdi:water
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_pflegeplan
  primary: Düngen
  secondary: '{% set p = state_attr(entity, ''fertilizing'') or {} %}{{ p.get(''window'') or ''—'' }}

    {{ (p.get(''reasons_text'') or []) | join('' · '') }}'
  multiline_secondary: true
  icon: mdi:flower
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_pflegeplan
  primary: Pflegereihenfolge
  secondary: '{% for step in state_attr(entity, ''prioritized_steps'') or [] %}{{ loop.index }}. {{ step.get(''action_text'')
    }} · {{ step.get(''availability_text'') or '''' }}{% if step.get(''not_before'') %} · {{ as_local(as_datetime(step.get(''not_before''))).strftime(''%d.%m.
    %H:%M'') }}{% endif %}

    {{ step.get(''blocker_text'') or step.get(''reason_text'') }}

    {% endfor %}'
  multiline_secondary: true
  icon: mdi:format-list-numbered
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_pflegeplan
  primary: Mähbeginn mit Tauprüfung
  secondary: '{% set p = state_attr(entity, ''mowing_window'') or {} %}{% if p.get(''start'') %}{{ as_local(as_datetime(p.get(''start''))).strftime(''%d.%m.
    %H:%M'') }}{% else %}—{% endif %}

    {{ p.get(''current_dew_risk_text'') or '''' }}

    {{ p.get(''reason_text'') or '''' }}


    {% set p = state_attr(entity, ''mowing_window'') or {} %}

    Dauer: {{ p.get(''required_minutes'', 0) }} min · Verfügbar: {{ p.get(''available_minutes'') if p.get(''available_minutes'')
    is not none else ''—'' }} min

    {% set alt = p.get(''alternative'') or {} %}

    Ausweichtermin: {% if alt.get(''start'') %}{{ as_local(as_datetime(alt.get(''start''))).strftime(''%d.%m.
    %H:%M'') }}–{{ as_local(as_datetime(alt.get(''end''))).strftime(''%d.%m. %H:%M'') }}{% else %}—{%
    endif %}

    {{ p.get(''quality_text'') or '''' }}

    {{ (p.get(''quality_reasons_text'') or []) | join('' · '') }}


    {% set p = state_attr(entity, ''mowing_window'') or {} %}

    {% set s = p.get(''duration_suggestion'') or {} %}

    Dauer-Vorschlag: {{ s.get(''suggested_minutes'') if s.get(''suggested_minutes'') is not none else
    ''—'' }} min · {{ s.get(''sample_count'', 0) }} Durchgänge

    {{ s.get(''reason_text'') or '''' }}

    Prognosealter: {{ p.get(''forecast_age_minutes'') if p.get(''forecast_age_minutes'') is not none else
    ''—'' }} min

    {{ (p.get(''change'') or {}).get(''reason_text'') or '''' }}

    {% set p = state_attr(entity, ''mowing_window'') or {} %}{% set s = p.get(''duration_suggestion'')
    or {} %}

    Verwendete Dauer: {{ s.get(''minimum_minutes'') if s.get(''minimum_minutes'') is not none else ''—''
    }}–{{ s.get(''maximum_minutes'') if s.get(''maximum_minutes'') is not none else ''—'' }} min

    {% for row in s.get(''excluded_text'') or [] %}{{ row.get(''count'') }} · {{ row.get(''text'') }}

    {% endfor %}

    {{ ((p.get(''evidence'') or {}).get(''supporting_unknown_text'') or []) | join('' · '') }}'
  multiline_secondary: true
  icon: mdi:grass
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.lawn_care_plan
  primary: Pflegeausblick – 48 Stunden
  icon: mdi:calendar-clock
  multiline_secondary: true
  secondary: '{% set o = state_attr(entity, ''outlook'') or {} %}

    {% for step in o.get(''steps'') or [] %}{{ loop.index }}. {{ step.get(''action_text'') or '''' }}

    Frühestens: {% if step.get(''not_before'') %}{{ as_local(as_datetime(step.get(''not_before''))).strftime(''%d.%m.
    %H:%M'') }}{% else %}—{% endif %}

    Wetterfenster zur Prüfung: {% if step.get(''candidate_at'') %}{{ as_local(as_datetime(step.get(''candidate_at''))).strftime(''%d.%m.
    %H:%M'') }}{% if step.get(''candidate_end'') %}–{{ as_local(as_datetime(step.get(''candidate_end''))).strftime(''%d.%m.
    %H:%M'') }}{% endif %}{% else %}—{% endif %}

    {{ step.get(''outlook_reason_text'') or '''' }}

    {{ step.get(''window_reason_text'') or step.get(''blocker_text'') or '''' }}

    Voraussetzung: {{ step.get(''dependency_text'') or ''—'' }}

    {% endfor %}

    {{ o.get(''scope_text'') or '''' }}'
  tap_action:
    action: more-info
