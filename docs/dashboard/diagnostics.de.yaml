type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.rasen_bewasserung_diagnose
  primary: Bewässerungsfreigabe
  secondary: '{% set reasons = state_attr(entity, ''automatic_blockers_text'') or [] %}{{ reasons | join(''

    '') if reasons else ''Alle Startbedingungen erfüllt.'' }}

    {{ state_attr(entity, ''action_hint'') or '''' }}'
  icon: mdi:shield-check
  multiline_secondary: true
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_datenqualitat
  primary: Datenqualität
  secondary: '{{ state_translated(entity) }}

    {% set inputs = state_attr(entity, ''input_diagnostics'') or {} %}{% for key, value in inputs.items() %}{{ key
    }}: {{ value.get(''reason'') }} · {{ value.get(''age_minutes'') if value.get(''age_minutes'') is not none else
    ''—'' }} min

    {% endfor %}'
  icon: mdi:database-check
  multiline_secondary: true
  tap_action:
    action: more-info
- type: entities
  title: Erfasste Bewässerung
  entities:
  - sensor.rasen_wasserverbrauch_heute
  - sensor.rasen_erfasste_bewasserung_diese_woche
  - sensor.rasen_erfasste_bewasserung_diesen_monat
