# docs/dashboard/mowing.de.yaml
#
# Show growth-dependent mowing recommendations and recent observed activity.
# Copy into a Lovelace manual card and replace the example entity IDs and
# REPLACE_WITH_ENTRY_ID where present. Mushroom cards require that custom frontend
# component. Templates render HA state translations while raw codes stay stable.
# This dashboard reads HA state; service buttons delegate validation to HA.
#
# Entitäten unter Entwicklerwerkzeuge → Zustände ersetzen.
# Für Bedienaktionen REPLACE_WITH_ENTRY_ID ersetzen.
type: custom:mushroom-template-card
entity: sensor.rasen_mahroboterstatus
primary: Mähen
secondary: '{{ state_translated(entity) }}

  {{ state_attr(entity, ''recommendation_reason_text'') or '''' }}

  Nächster Termin: {% set at = state_attr(entity, ''next_mowing_at'') %}{{ as_local(as_datetime(at)).strftime(''%d.%m.
  %H:%M'') if at else ''—'' }}

  {% set live = state_attr(entity, ''live_robot_session'') or {} %}Aktive Minuten: {{ live.get(''active_minutes'',
  0) }} · {{ live.get(''status'', ''idle'') }}

  Letzte Sitzung, geschätzt: {{ state_attr(entity, ''last_robot_session_active_minutes'') if state_attr(entity,
  ''last_robot_session_active_minutes'') is not none else ''—'' }} min

  {% set p = state_attr(entity, ''mowing_window'') or {} %}

  Geschätztes Mähfenster: {% if p.get(''start'') %}{{ as_local(as_datetime(p.get(''start''))).strftime(''%d.%m.
  %H:%M'') }}–{{ as_local(as_datetime(p.get(''end''))).strftime(''%H:%M'') }}{% else %}—{% endif %}

  {{ p.get(''current_dew_risk_text'') or '''' }}

  {{ p.get(''reason_text'') or '''' }}

  {{ (p.get(''missing_inputs_text'') or []) | join('' · '') }}'
icon: mdi:robot-mower
icon_color: '{{ state_attr(entity, ''icon_color'') or ''grey'' }}'
multiline_secondary: true
tap_action:
  action: more-info
