# docs/dashboard/consumption.en.yaml
#
# Show recorded daily, weekly and monthly water usage and quality details.
# Copy into a Lovelace manual card and replace the example entity IDs and
# REPLACE_WITH_ENTRY_ID where present. Mushroom cards require that custom frontend
# component. Templates render HA state translations while raw codes stay stable.
# This dashboard reads HA state; service buttons delegate validation to HA.
#
type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.lawn_water_consumption_today
  primary: Watering history
  secondary: '{% set records = state_attr(entity, ''recent_records'') or [] %}{% for r in records %}{{ r.get(''recorded_at'')
    or r.get(''date'') }} · {{ r.get(''liters'') if r.get(''liters'') is not none else ''—'' }} L · {{ r.get(''source_text'')
    or r.get(''source'') }} · {{ r.get(''reason_text'') or '''' }} · {{ ((r.get(''active_seconds'') or 0) / 60)
    | round(1) }} min{% if r.get(''measurement_gap'') %} · ⚠ {% endif %}

    {% endfor %}'
  icon: mdi:history
  multiline_secondary: true
  tap_action:
    action: more-info
- type: entities
  entities:
  - sensor.lawn_water_consumption_today
  - sensor.lawn_recorded_watering_this_week
  - sensor.lawn_recorded_watering_this_month
