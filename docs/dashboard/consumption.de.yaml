type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.rasen_wasserverbrauch_heute
  primary: Bewässerungsverlauf
  secondary: '{% set records = state_attr(entity, ''recent_records'') or [] %}{% for r in records %}{{ r.get(''recorded_at'')
    or r.get(''date'') }} · {{ r.get(''liters'') if r.get(''liters'') is not none else ''—'' }} L · {{ r.get(''source_text'')
    or r.get(''source'') }} · {{ r.get(''reason_text'') or '''' }} · {{ ((r.get(''active_seconds'') or 0) / 60)
    | round(1) }} min{% if r.get(''measurement_gap'') %} · ⚠ {% endif %}

    {% endfor %}'
  icon: mdi:history
  multiline_secondary: true
  tap_action:
    action: more-info
- type: entities
  entities:
  - sensor.rasen_wasserverbrauch_heute
  - sensor.rasen_erfasste_bewasserung_diese_woche
  - sensor.rasen_erfasste_bewasserung_diesen_monat
