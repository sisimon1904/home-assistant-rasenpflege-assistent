# docs/dashboard/diagnostics.en.yaml
#
# Show model/input quality and explain missing or stale observations.
# Copy into a Lovelace manual card and replace the example entity IDs and
# REPLACE_WITH_ENTRY_ID where present. Mushroom cards require that custom frontend
# component. Templates render HA state translations while raw codes stay stable.
# This dashboard reads HA state; service buttons delegate validation to HA.
#
type: vertical-stack
cards:
- type: custom:mushroom-template-card
  entity: sensor.rasen_bewasserung_diagnose
  primary: Irrigation readiness
  secondary: '{% set reasons = state_attr(entity, ''automatic_blockers_text'') or [] %}{{ reasons | join(''

    '') if reasons else ''All start conditions passed.'' }}

    {{ state_attr(entity, ''action_hint'') or '''' }}'
  icon: mdi:shield-check
  multiline_secondary: true
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_datenqualitat
  primary: Data quality
  secondary: '{{ state_translated(entity) }}

    {% set inputs = state_attr(entity, ''input_diagnostics'') or {} %}{% for key, value in inputs.items() %}{{ key
    }}: {{ value.get(''reason'') }} · {{ value.get(''age_minutes'') if value.get(''age_minutes'') is not none else
    ''—'' }} min

    {% endfor %}'
  icon: mdi:database-check
  multiline_secondary: true
  tap_action:
    action: more-info
- type: entities
  title: Recorded irrigation
  entities:
  - sensor.lawn_water_consumption_today
  - sensor.rasen_erfasste_bewasserung_diese_woche
  - sensor.rasen_erfasste_bewasserung_diesen_monat
- type: custom:mushroom-template-card
  entity: sensor.rasen_modellierte_bodenfeuchte
  primary: Soil model & calibration
  secondary: '{% set model = state_attr(entity, ''model_insights'') or {} %}{% set calibration = model.get(''calibration'',
    {}) %}

    Median difference: {{ calibration.get(''median_deviation_percentage_points'') if calibration.get(''median_deviation_percentage_points'')
    is not none else ''—'' }} percentage points

    {{ (calibration.get(''reasons_text'') or []) | join(''

    '') }}

    {{ (model.get(''watering_response'', {}).get(''reasons_text'') or []) | join(''

    '') }}'
  icon: mdi:chart-timeline-variant
  multiline_secondary: true
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_bewasserungsempfehlung
  primary: Watering amount explained
  secondary: '{% set dose = state_attr(entity, ''watering_explanation'') or {} %}

    Deficit to model target: {{ dose.get(''deficit_to_target_mm'', ''—'') }} mm

    To apply: {{ dose.get(''recommended_gross_mm'', ''—'') }} mm · {{ dose.get(''recommended_liters'', ''—'') }}
    L

    Estimated root-zone credit: {{ dose.get(''estimated_root_zone_credit_mm'', ''—'') }} mm'
  icon: mdi:water-plus
  multiline_secondary: true
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_modellierte_bodenfeuchte
  primary: Weekly comparison
  secondary: '{% set model = state_attr(entity, ''model_insights'') or {} %}{% set w = model.get(''weekly_comparison'',
    {}) %}{% set c = w.get(''current'', {}) %}{% set p = w.get(''previous'', {}) %}

    Hours current/previous: {{ c.get(''hourly_snapshots'', 0) }}/{{ p.get(''hourly_snapshots'', 0) }}

    Rain current/previous: {{ c.get(''observed_rain_mm'') if c.get(''observed_rain_mm'') is not none else ''—''
    }}/{{ p.get(''observed_rain_mm'') if p.get(''observed_rain_mm'') is not none else ''—'' }} mm

    Moisture change: {{ w.get(''moisture_change_percentage_points'') if w.get(''moisture_change_percentage_points'')
    is not none else ''—'' }} pp

    {{ (model.get(''sensor_review'', {}).get(''reasons_text'') or []) | join(''

    '') }}

    Change rain / ET / liters: {% set d = w.get(''changes'', {}) %}{{ d.get(''observed_rain_mm'') if d.get(''observed_rain_mm'')
    is not none else ''—'' }} mm / {{ d.get(''estimated_et_mm'') if d.get(''estimated_et_mm'') is not none else
    ''—'' }} mm / {{ d.get(''recorded_liters'') if d.get(''recorded_liters'') is not none else ''—'' }} L'
  multiline_secondary: true
  icon: mdi:chart-box
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_bewasserung_diagnose
  primary: Cycles and soak pauses
  secondary: '{% set p = state_attr(entity, ''cycle_plan'') or {} %}Active / pauses / total: {{ p.get(''active_minutes'')
    if p.get(''active_minutes'') is not none else ''—'' }} / {{ p.get(''pause_minutes'') if p.get(''pause_minutes'')
    is not none else ''—'' }} / {{ p.get(''total_minutes'') if p.get(''total_minutes'') is not none else ''—'' }}
    min

    {{ (p.get(''reasons_text'') or []) | join(''

    '') }}'
  multiline_secondary: true
  icon: mdi:water-sync
  tap_action:
    action: more-info
- type: custom:mushroom-template-card
  entity: sensor.rasen_datenqualitat
  primary: Mowing window – evidence
  secondary: '{% set p = state_attr(entity, ''mowing_window_quality'') or {} %}{{ p.get(''current_dew_risk_text'')
    or '''' }}

    {{ (p.get(''missing_inputs_text'') or []) | join(''

    '') }}

    {{ p.get(''reason_text'') or '''' }}'
  icon: mdi:weather-fog
  multiline_secondary: true
  tap_action:
    action: more-info
