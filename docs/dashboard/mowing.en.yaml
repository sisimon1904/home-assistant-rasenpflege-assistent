# docs/dashboard/mowing.en.yaml
#
# Show growth-dependent mowing recommendations and recent observed activity.
# Copy into a Lovelace manual card and replace the example entity IDs and
# REPLACE_WITH_ENTRY_ID where present. Mushroom cards require that custom frontend
# component. Templates render HA state translations while raw codes stay stable.
# This dashboard reads HA state; service buttons delegate validation to HA.
#
# Replace entities using Developer tools → States.
# Replace REPLACE_WITH_ENTRY_ID before using control actions.
type: custom:mushroom-template-card
entity: sensor.rasen_mahroboterstatus
primary: Mowing
secondary: '{{ state_translated(entity) }}

  {{ state_attr(entity, ''recommendation_reason_text'') or '''' }}

  Next mowing: {% set at = state_attr(entity, ''next_mowing_at'') %}{{ as_local(as_datetime(at)).strftime(''%d.%m.
  %H:%M'') if at else ''—'' }}

  {% set live = state_attr(entity, ''live_robot_session'') or {} %}Active minutes: {{ live.get(''active_minutes'',
  0) }} · {{ live.get(''status'', ''idle'') }}

  Last session, estimated: {{ state_attr(entity, ''last_robot_session_active_minutes'') if state_attr(entity, ''last_robot_session_active_minutes'')
  is not none else ''—'' }} min

  {% set p = state_attr(entity, ''mowing_window'') or {} %}

  Estimated mowing window: {% if p.get(''start'') %}{{ as_local(as_datetime(p.get(''start''))).strftime(''%d.%m.
  %H:%M'') }}–{{ as_local(as_datetime(p.get(''end''))).strftime(''%H:%M'') }}{% else %}—{% endif %}

  {{ p.get(''current_dew_risk_text'') or '''' }}

  {{ p.get(''reason_text'') or '''' }}

  {{ (p.get(''missing_inputs_text'') or []) | join('' · '') }}


  {% set p = state_attr(entity, ''mowing_window'') or {} %}

  Duration: {{ p.get(''required_minutes'', 0) }} min · Available: {{ p.get(''available_minutes'') if p.get(''available_minutes'')
  is not none else ''—'' }} min

  {% set alt = p.get(''alternative'') or {} %}

  Alternative: {% if alt.get(''start'') %}{{ as_local(as_datetime(alt.get(''start''))).strftime(''%d.%m. %H:%M'')
  }}–{{ as_local(as_datetime(alt.get(''end''))).strftime(''%d.%m. %H:%M'') }}{% else %}—{% endif %}

  {{ p.get(''quality_text'') or '''' }}

  {{ (p.get(''quality_reasons_text'') or []) | join('' · '') }}


  {% set p = state_attr(entity, ''mowing_window'') or {} %}

  {% set s = p.get(''duration_suggestion'') or {} %}

  Suggested duration: {{ s.get(''suggested_minutes'') if s.get(''suggested_minutes'') is not none else ''—'' }}
  min · {{ s.get(''sample_count'', 0) }} observations

  {{ s.get(''reason_text'') or '''' }}

  Forecast age: {{ p.get(''forecast_age_minutes'') if p.get(''forecast_age_minutes'') is not none else ''—'' }}
  min

  {{ (p.get(''change'') or {}).get(''reason_text'') or '''' }}'
icon: mdi:robot-mower
icon_color: '{{ state_attr(entity, ''icon_color'') or ''grey'' }}'
multiline_secondary: true
tap_action:
  action: more-info
