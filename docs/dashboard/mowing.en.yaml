# docs/dashboard/mowing.en.yaml
#
# Show growth-dependent mowing recommendations and recent observed activity.
# Copy into a Lovelace manual card and replace the example entity IDs and
# REPLACE_WITH_ENTRY_ID where present. Mushroom cards require that custom frontend
# component. Templates render HA state translations while raw codes stay stable.
# This dashboard reads HA state; service buttons delegate validation to HA.
#
# Replace entities using Developer tools → States.
# Replace REPLACE_WITH_ENTRY_ID before using control actions.
type: custom:mushroom-template-card
entity: sensor.rasen_mahroboterstatus
primary: Mowing
secondary: '{{ state_translated(entity) }}

  {{ state_attr(entity, ''recommendation_reason_text'') or '''' }}

  Next mowing: {% set at = state_attr(entity, ''next_mowing_at'') %}{{ as_local(as_datetime(at)).strftime(''%d.%m. %H:%M'') if at else ''—'' }}

  {% set live = state_attr(entity, ''live_robot_session'') or {} %}Active minutes: {{ live.get(''active_minutes'', 0) }} · {{ live.get(''status'', ''idle'') }}

  Last session, estimated: {{ state_attr(entity, ''last_robot_session_active_minutes'') if state_attr(entity, ''last_robot_session_active_minutes'') is not none else ''—'' }} min'
icon: mdi:robot-mower
icon_color: '{{ state_attr(entity, ''icon_color'') or ''grey'' }}'
multiline_secondary: true
tap_action:
  action: more-info
