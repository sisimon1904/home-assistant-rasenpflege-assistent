record_watering:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: rasenpflege_assistent
    amount_mm:
      example: 12.5
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: mm
    recorded_at:
      example: '2026-10-01T08:00:00+02:00'
      selector:
        text: {}
record_fertilizing:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: rasenpflege_assistent
    product_npk:
      example: 20-5-8
      selector:
        text: null
    amount_kg:
      example: 3.0
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: kg
    recorded_at:
      example: '2026-10-01T08:00:00+02:00'
      selector:
        text: {}
record_mowing:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: rasenpflege_assistent
    recorded_at:
      example: '2026-10-01T08:00:00+02:00'
      selector:
        text: {}
undo_last_action:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: rasenpflege_assistent
start_irrigation:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: rasenpflege_assistent
    target_liters:
      selector:
        number:
          min: 0.1
          max: 50000
          step: 0.1
          unit_of_measurement: L
    target_mm:
      selector:
        number:
          min: 0.1
          max: 50
          step: 0.1
          unit_of_measurement: mm
stop_irrigation:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: rasenpflege_assistent
suspend_irrigation:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: rasenpflege_assistent
    until:
      example: '2026-10-02T08:00:00+02:00'
      selector:
        text: null
