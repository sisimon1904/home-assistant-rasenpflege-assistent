# .github/workflows/tests.yml
#
# Check release versions, formatting, lint, typing, regression/coverage and
# Chromium dashboard behavior on pushes and PRs. Browser fixtures use HA
# doubles without physical hardware. Python fixtures pin matching Home Assistant
# dependencies. Overall coverage must reach 83 percent; publish the XML report.
#
name: Tests

on:
  push:
  pull_request:

jobs:
  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix tests/browser
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Fail early on partial version bumps before installing large HA packages.
      - name: Validate release version consistency
        run: python scripts/check_release_versions.py
      # The fixture package pins its own exact HA/SQLAlchemy versions.
      # Install the tested fixture set unchanged; never override its pins.
      - name: Install pinned Home Assistant test fixtures
        run: python -m pip install pytest ruff==0.16.10 mypy==2.4.0 pytest-cov pytest-homeassistant-custom-component==0.13.367
      - name: Show actual Home Assistant test version
        run: |
          python -c "from importlib.metadata import version; print('HA:', version('homeassistant')); print('Fixtures:', version('pytest-homeassistant-custom-component')); print('SQLAlchemy:', version('SQLAlchemy'))"
      - run: python -m pip check
      - run: python -m ruff format --check custom_components tests scripts
      - run: python -m ruff check custom_components tests scripts
      - run: python -m mypy
      - run: python -m pytest -q --cov=custom_components.rasenpflege_assistent --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=83

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
