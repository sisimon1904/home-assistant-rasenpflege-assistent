# .github/workflows/tests.yml
#
# Run formatting, lint, typing, regression/coverage and Chromium dashboard checks
# on pushes and PRs. Browser fixtures use HA doubles without physical devices.
# Home Assistant is pinned per matrix row; pip resolves a compatible test helper
# together with HA rather than overwriting the helper's exact dependency pins.
# The combined
# coverage threshold is 83 percent; publish its XML report for review.
#
name: Tests

on:
  push:
  pull_request:

jobs:
  dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --prefix tests/browser
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix tests/browser
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha-version: ['2026.10.4', '2026.11.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Resolve the HA version and its matching pytest fixtures in one transaction.
      # The fixture package pins HA and SQLAlchemy; installing HA afterwards
      # breaks that relationship and makes pip check fail before tests start.
      - name: Install matching Home Assistant and test dependencies
        run: |
          python -m pip install \
            "homeassistant==${{ matrix.ha-version }}" \
            "pytest-homeassistant-custom-component>=0.13.367" \
            pytest pytest-cov ruff==0.16.10 mypy==2.4.0
          python -m pip freeze | grep -Ei '^(homeassistant|pytest-homeassistant-custom-component|sqlalchemy)=='
      - run: python -m pip check
      - run: python -m ruff format --check custom_components tests
      - run: python -m ruff check custom_components tests
      - run: python -m mypy
      - run: python -m pytest -q --cov=custom_components.rasenpflege_assistent --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=83

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ha-${{ matrix.ha-version }}
          path: coverage.xml
