# .github/workflows/tests.yml
#
# Run formatting, lint, typing and regression/coverage checks on pushes and PRs.
# Python and the HA test package are pinned for repeatability. The combined
# coverage threshold is 83 percent; publish its XML report for review.
#
name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest ruff==0.16.10 mypy==2.4.0 pytest-cov pytest-homeassistant-custom-component==0.13.367
      - run: python -m ruff format --check custom_components tests
      - run: python -m ruff check custom_components tests
      - run: python -m mypy
      - run: python -m pytest -q --cov=custom_components.rasenpflege_assistent --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=83

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
