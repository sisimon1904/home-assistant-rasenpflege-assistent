# .github/workflows/validate.yml
#
# Validate integration metadata and packaging on pushes and PRs.
# Hassfest checks HA conventions; HACS checks custom-integration packaging.
# These checks complement tests and do not certify every Quality Scale rule.
#
name: Validate

on:
  push:
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
