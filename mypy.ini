# mypy.ini -- local integration type checking, also used by GitHub CI.
# HA/provider payloads remain dynamic at their boundaries. Check all function
# bodies; core calculations, persisted models and storage use strict checking.
# External dependencies are followed silently, without hiding local errors.
[mypy]
python_version = 3.14
files = custom_components/rasenpflege_assistent
explicit_package_bases = True
follow_imports = silent
ignore_missing_imports = True
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
# Use the Python parser and JSON cache for constrained/container runtimes.
native_parser = False
sqlite_cache = False
fixed_format_cache = False

[mypy-custom_components.rasenpflege_assistent.calculations,custom_components.rasenpflege_assistent.diagnostic_types,custom_components.rasenpflege_assistent.models,custom_components.rasenpflege_assistent.planning,custom_components.rasenpflege_assistent.storage,custom_components.rasenpflege_assistent.inputs,custom_components.rasenpflege_assistent.insights,custom_components.rasenpflege_assistent.everyday,custom_components.rasenpflege_assistent.mowing,custom_components.rasenpflege_assistent.mowing_plan,custom_components.rasenpflege_assistent.guidance,custom_components.rasenpflege_assistent.review]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_any_generics = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
